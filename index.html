<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVOR Case Counter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

<header>
    <h1>❤️ CVOR Case Counter</h1>
    <div class="sub" id="todayDate">Loading date...</div>
</header>

<div class="content">

    <div class="section">Today</div>

    <div class="grid" id="caseGrid"></div>

    <button class="add" onclick="openModal()">＋ ADD CASE</button>

    <div class="section">Volume</div>

    <div class="row">
        <span>This Week</span>
        <b id="weekTotal">0</b>
    </div>

    <div class="row">
        <span>This Month</span>
        <b id="monthTotal">0</b>
    </div>

    <div class="row">
        <span>This Year</span>
        <b id="yearTotal">0</b>
    </div>

    <div class="section" style="margin-top:22px">
        Monthly Breakdown
    </div>

    <div class="row">
        <span>❤️ CABG</span>
        <b id="monthCabg">0</b>
    </div>

    <div class="row">
        <span>🫀 Valve</span>
        <b id="monthValve">0</b>
    </div>

    <div class="row">
        <span>🫁 Thoracic</span>
        <b id="monthThoracic">0</b>
    </div>

    <div class="row">
        <span>🩸 Vascular</span>
        <b id="monthVascular">0</b>
    </div>

    <div class="row">
        <span>🫀 Structural / TAVR</span>
        <b id="monthTavr">0</b>
    </div>

</div>
</div>

<!-- Add Case Modal -->
<div class="modal" id="modal"
     onclick="if(event.target.id==='modal') closeModal()">

    <div class="sheet">

        <h2 style="margin-top:0">
            Add Case
        </h2>

        <div class="sub" style="margin-bottom:15px">
            Select case type
        </div>

        <div class="case-form">
            <input id="newTypeName" type="text" placeholder="New case type" maxlength="30">
            <button class="small-button" type="button" onclick="addCaseType()">Add</button>
        </div>

        <div class="types" id="typeList"></div>

        <button class="save" onclick="saveCase()">
            SAVE CASE
        </button>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
