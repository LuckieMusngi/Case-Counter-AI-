<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVOR Case Counter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

<header>
    <h1>❤️ CVOR Case Counter</h1>
    <div class="sub" id="todayDate">Loading date...</div>
</header>

<div class="content">

    <div id="casesView" class="view active">
        <div class="section-row">
            <div class="section" id="casesHeaderTitle">Today</div>
            <button type="button" id="backToTodayBtn" class="mini-link" onclick="goToToday()">Back to Today</button>
        </div>
        <div class="grid" id="caseGrid"></div>
        <button class="add" onclick="openModal()">＋ ADD CASE</button>
    </div>

    <div id="statsView" class="view">
        <div class="section">Monthly Stats</div>
        <div class="stats-header">
            <button type="button" id="prevYearBtn" class="year-btn" aria-label="Previous year">‹</button>
            <div class="stats-year-block">
                <div id="statsYearLabel" class="stats-year-label">2026</div>
                <div class="stats-total-label">Total Cases</div>
                <div id="yearTotalDisplay" class="stats-total-value">0</div>
            </div>
            <button type="button" id="nextYearBtn" class="year-btn" aria-label="Next year">›</button>
        </div>
        <div id="monthlyStats" class="monthly-stats"></div>
    </div>

</div>

<nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" class="nav-btn active" data-view="casesView">Cases</button>
    <button type="button" class="nav-btn" data-view="statsView">Stats</button>
</nav>

</div>

<!-- Add Case Modal -->
<div class="modal" id="modal"
     onclick="if(event.target.id==='modal') closeModal()">

    <div class="sheet">

        <h2 style="margin-top:0">
            Add Case
        </h2>

        <div class="sub" style="margin-bottom:15px">
            Select case type
        </div>

        <div class="case-form">
            <input id="newTypeName" type="text" placeholder="New case type" maxlength="30">
            <button class="small-button" type="button" onclick="addCaseType()">Add</button>
        </div>

        <div class="types" id="typeList"></div>

        <button class="save" onclick="saveCase()">
            SAVE CASE
        </button>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
