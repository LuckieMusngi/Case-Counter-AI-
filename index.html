<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVOR Case Counter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

<header>
    <h1>❤️ CVOR Case Counter</h1>
    <div class="sub">September 5, 2026</div>
</header>

<div class="content">

    <div class="section">Today</div>

    <div class="grid">

        <div class="card">
            <div class="label">❤️ CABG</div>
            <div class="num" id="cabg">0</div>
            <button onclick="quick('cabg')" class="type">+ 1 Case</button>
        </div>

        <div class="card">
            <div class="label">🫀 Valve</div>
            <div class="num" id="valve">0</div>
            <button onclick="quick('valve')" class="type">+ 1 Case</button>
        </div>

        <div class="card">
            <div class="label">🫁 Thoracic</div>
            <div class="num" id="thoracic">0</div>
            <button onclick="quick('thoracic')" class="type">+ 1 Case</button>
        </div>

        <div class="card">
            <div class="label">🩸 Vascular</div>
            <div class="num" id="vascular">0</div>
            <button onclick="quick('vascular')" class="type">+ 1 Case</button>
        </div>

        <div class="card">
            <div class="label">🫀 Structural / TAVR</div>
            <div class="num" id="tavr">0</div>
            <button onclick="quick('tavr')" class="type">+ 1 Case</button>
        </div>

        <div class="card total">
            <div class="label">TOTAL CASES</div>
            <div class="num" id="total">0</div>
        </div>

    </div>

    <button class="add" onclick="openModal()">＋ ADD CASE</button>

    <div class="section">Volume</div>

    <div class="row">
        <span>This Week</span>
        <b id="weekTotal">0</b>
    </div>

    <div class="row">
        <span>This Month</span>
        <b id="monthTotal">0</b>
    </div>

    <div class="row">
        <span>This Year</span>
        <b id="yearTotal">0</b>
    </div>

    <div class="section" style="margin-top:22px">
        Monthly Breakdown
    </div>

    <div class="row">
        <span>❤️ CABG</span>
        <b id="monthCabg">0</b>
    </div>

    <div class="row">
        <span>🫀 Valve</span>
        <b id="monthValve">0</b>
    </div>

    <div class="row">
        <span>🫁 Thoracic</span>
        <b id="monthThoracic">0</b>
    </div>

    <div class="row">
        <span>🩸 Vascular</span>
        <b id="monthVascular">0</b>
    </div>

    <div class="row">
        <span>🫀 Structural / TAVR</span>
        <b id="monthTavr">0</b>
    </div>

</div>
</div>

<!-- Navigation -->
<div class="nav">
    <button class="active">
        🏠<br>Dashboard
    </button>

    <button>
        📊<br>Reports
    </button>

    <button>
        👨‍⚕️<br>Surgeons
    </button>

    <button>
        👥<br>Staffing
    </button>

    <button>
        ⚙️<br>Settings
    </button>
</div>

<!-- Add Case Modal -->
<div class="modal" id="modal"
     onclick="if(event.target.id==='modal') closeModal()">

    <div class="sheet">

        <h2 style="margin-top:0">
            Add Case
        </h2>

        <div class="sub" style="margin-bottom:15px">
            Select case type
        </div>

        <div class="types">

            <button class="type"
                    onclick="selectType('cabg', this)">
                ❤️ CABG
            </button>

            <button class="type"
                    onclick="selectType('valve', this)">
                🫀 Valve
            </button>

            <button class="type"
                    onclick="selectType('thoracic', this)">
                🫁 Thoracic
            </button>

            <button class="type"
                    onclick="selectType('vascular', this)">
                🩸 Vascular
            </button>

            <button class="type"
                    onclick="selectType('tavr', this)">
                🫀 TAVR
            </button>

            <button class="type"
                    onclick="selectType('other', this)">
                ＋ Other
            </button>

        </div>

        <button class="save" onclick="saveCase()">
            SAVE CASE
        </button>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
